<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <title>HOMEWORK</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<h1 class="text-center"> This is my homework #36 </h1>
<hr class="mb-3">

<div class="container" data-container-table>

    <div class="d-flex justify-content-between align-items-center mb-3 ">
        <div class="my-width-310">
            <input type="text" class="form-control border-success" id="exampleFormControlInput1" disabled data-input-search placeholder="Filter by Name / Email / Company">
        </div>

        <div data-loading>
            <div class="spinner-border text-success" role="status"></div>
            <span class=" fs-2 ms-3"> Loading table ... </span>
        </div>

        <button class="btn btn-success btn-lg btn-block my-width-200" type="button" disabled data-btn-add-user>Add user</button>
    </div>

    <table class="table table-bordered table-hover" data-all-table>
        <thead class="table-secondary">
        <tr class="text-center">
            <th scope="col" class=" px-3 my-width-50" data-table-title data-table-title-id >
                <div class="d-flex justify-content-between align-items-center">
                    <div class="my-width-10"></div>
                    <div>ID</div>
                    <div class="my-width-10"> <i class="bi bi-arrow-down d-none" data-arrow data-arrow-id></i></div>
                </div>
            </th>
            <th scope="col" data-table-title data-table-title-name>
                NAME
                <i class="bi bi-arrow-down d-none" data-arrow data-arrow-name></i>
            </th>
            <th scope="col" data-table-title data-table-title-email>
                EMAIL
                <i class="bi bi-arrow-down d-none" data-arrow data-arrow-email></i>
            </th>
            <th scope="col" data-table-title data-table-title-company>
                COMPANY
                <i class="bi bi-arrow-down d-none" data-arrow data-arrow-company></i>
            </th>
            <th scope="col">PHONE</th>
            <th class="my-width-100" scope="col">EDIT</th>
            <th class="my-width-100" scope="col">DELETE</th>
        </tr>
        </thead>
        <tbody data-table-body></tbody>
    </table>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="js/main.js" type="module"></script>

</body>

</html>
