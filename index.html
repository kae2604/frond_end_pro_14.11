<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <title>HOMEWORK</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <h1 class="text-center" > This is my homework #34 </h1>
    <hr class="mb-5">

    <div class="myContainer d-flex justify-content-between">
        <form class="form my-form" data-form-notes>
            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Title</label>
                <input type="text" name="title" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" placeholder="Enter your note here" data-form-title>
            </div>

            <div>
                <label for="select" class="form-label">Category</label>
                <select class="form-select form-select-lg mb-3" aria-label="Large select example" id="select" name="category">
                    <option value="" selected> Choose the category</option>
                    <option value="Work">Work</option>
                    <option value="Study">Study</option>
                    <option value="Personal">Personal</option>
                </select>
            </div>

            <div class="form-check mb-3">
                <input type="checkbox" name="important" class="form-check-input" id="exampleCheck1">
                <label class="form-check-label" for="exampleCheck1">Important</label>
            </div>
            <hr>
            <button type="submit" class="btn btn-success w-100">Create note</button>
        </form>

        <div class="right-block">
            <div class="d-flex justify-content-between  notes-filter p-3" >
                <div class="d-flex justify-content-between  notes-filter p-3" data-filters-block>
                    <div>
                        <button type="button" class="btn btn-filter all-color" data-btn-all>All</button>
                        <div class="count-box"  data-count-total-box></div>
                    </div>
                    <div>
                        <button type="button" class="btn btn-filter important-color" data-btn-important>Important</button>
                        <div class="count-box"  data-count-important-box></div>
                    </div>
                    <div>
                        <button type="button" class="btn btn-filter work-color" data-btn-work>Work</button>
                        <div class="count-box"  data-count-Work-box></div>
                    </div>
                    <div>
                        <button type="button" class="btn btn-filter study-color" data-btn-study>Study</button>
                        <div class="count-box"  data-count-Study-box></div>
                    </div>
                    <div>
                        <button type="button" class="btn btn-filter personal-color" data-btn-personal>Personal</button>
                        <div class="count-box"  data-count-Personal-box></div>
                    </div>

                </div>

                <div class="d-flex justify-content-between  notes-filter p-3" data-term-block>
                    <button type="button" class="btn btn-filter btn-primary" data-btn-new >New first</button>
                    <button type="button" class="btn btn-filter btn-primary" data-btn-old >Old first</button>
                </div>

                <div class=" p-3">
                    <button type="button" class="btn btn-remove-all btn-danger" data-btn-remove-all>
                        <i class="bi bi-trash-fill"></i>
                        <span>Remove All</span>
                    </button>
                </div>
            </div>

            <div class="notesList" id="notesList">

            </div>
        </div>
    </div>

    <form action="#" class="editModal" data-edit-modal >
        <div class="mb-4">
            <input type="text" name="edit" class="form-control form-edit"  aria-describedby="emailHelp" placeholder="Enter your changes here" data-input-edit>
        </div>
        <div class="d-flex justify-content-between mx-3">
            <button type="button" class="btn btn-danger w-25" data-btn-close-modal >Close modal</button>
            <button type="submit" class="btn btn-success w-25" data-btn-edit-note >Edit note</button>
        </div>
    </form>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="js/app.js" type="module"></script>

</body>

</html>
